name: Build Chladroid Android APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read


env:
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"


jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ==========================================================
      # Python 3.11
      # ==========================================================

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      - name: Verify Python
        run: |
          python --version
          python -c "import sys; print(sys.executable)"


      # ==========================================================
      # Java 17
      # ==========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      - name: Verify Java
        run: |
          java -version
          javac -version


      # ==========================================================
      # Linux dependencies
      # ==========================================================

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            libltdl-dev \
            ccache \
            rustc \
            cargo


      # ==========================================================
      # Python build dependencies
      # ==========================================================

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          # Buildozer/p4a currently expects the 0.29 Cython series.
          python -m pip install "Cython==0.29.34"


      - name: Verify Cython
        run: |
          cython --version
          python -c "import Cython; print('Cython:', Cython.__version__)"


      # ==========================================================
      # Install Buildozer
      # ==========================================================

      - name: Install Buildozer
        run: |
          python -m pip install buildozer==1.5.0

          buildozer --version


      # ==========================================================
      # Verify repository
      # ==========================================================

      - name: Inspect project
        run: |
          echo "=========================================="
          echo "Python"
          echo "=========================================="
          python --version

          echo
          echo "=========================================="
          echo "Cython"
          echo "=========================================="
          cython --version

          echo
          echo "=========================================="
          echo "Buildozer"
          echo "=========================================="
          buildozer --version

          echo
          echo "=========================================="
          echo "Project files"
          echo "=========================================="

          find . \
            -maxdepth 2 \
            -type f \
            ! -path "./.git/*" \
            | sort

          echo
          echo "=========================================="
          echo "buildozer.spec"
          echo "=========================================="

          cat buildozer.spec


      # ==========================================================
      # Clean EVERYTHING from previous Android builds
      # ==========================================================

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf "$HOME/.buildozer"


      # ==========================================================
      # Initialize Buildozer / download p4a
      # ==========================================================

      - name: Check python-for-android
        run: |
          buildozer android p4a -- --help


      # ==========================================================
      # Build debug APK
      # ==========================================================

      - name: Build debug APK
        run: |
          buildozer -v android debug


      # ==========================================================
      # Display APK
      # ==========================================================

      - name: Find APK
        if: always()
        run: |
          echo "=========================================="
          echo "APK files"
          echo "=========================================="

          find . \
            -type f \
            -name "*.apk" \
            -print


      # ==========================================================
      # Upload APK
      # ==========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chladroid-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
